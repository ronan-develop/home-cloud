# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.storage_dir: '%kernel.project_dir%/var/storage'
    # Fichier plat de dernière activité authentifiée (#422) — lu par un futur
    # script bash de déploiement (#421), jamais par un process PHP lancé
    # depuis un cron : coût nul sur le LVE partagé entre les 7 instances.
    app.activity_tracker.file_path: '%kernel.project_dir%/var/last-activity.txt'
    # Fichier plat de préavis de déploiement (#422 étape 3/3) — écrit par
    # bin/deploy-nightly.sh au début du sleep de préavis, retiré une fois le
    # déploiement terminé ou reporté. warning_seconds doit rester aligné sur
    # DEPLOY_NIGHTLY_WARNING_SECONDS (défaut 600s côté script).
    app.deploy_imminent.file_path: '%kernel.project_dir%/var/deploy-imminent.txt'
    app.deploy_imminent.warning_seconds: 600
    app.encryption_key: '%env(base64:APP_ENCRYPTION_KEY)%'
    app.ffmpeg_bin: '%kernel.project_dir%/var/bin/ffmpeg'
    app.ffprobe_bin: '%kernel.project_dir%/var/bin/ffprobe'
    # Seuil de taille cumulée (octets) au-delà duquel un lot d'upload est déporté
    # au worker Messenger plutôt que traité immédiatement. 250 Mo par défaut,
    # ajustable sans redéploiement de code.
    hc.upload.deferred_threshold_bytes: 262144000

services:
    # Bindings interfaces → implémentations (Dependency Inversion Principle)
    App\Interface\Album\AlbumRepositoryInterface: '@App\Repository\AlbumRepository'
    App\Interface\Folder\FolderRepositoryInterface: '@App\Repository\FolderRepository'
    App\Interface\UserRepositoryInterface:        '@App\Repository\UserRepository'
    App\Interface\Share\ShareRepositoryInterface: '@App\Repository\ShareRepository'
    App\Interface\GitHub\ChangelogFetcherInterface: '@App\Service\GitHub\GitHubChangelogFetcher'
    App\Interface\GitHub\PrTitleCleanerInterface: '@App\Service\GitHub\PrTitleCleaner'
    App\Interface\Share\ShareLinkRepositoryInterface: '@App\Repository\ShareLinkRepository'
    App\Interface\Share\ShareLinkAccessCheckerInterface: '@App\Security\ShareLinkAccessChecker'
    App\Interface\ResourceLocatorInterface:       '@App\Security\ResourceLocator'
    App\Interface\Share\SharedResourceCleanerInterface: '@App\Security\SharedResourceCleaner'
    App\Interface\File\FilenameValidatorInterface: '@App\Service\File\FilenameValidator'
    App\Interface\Auth\OwnershipCheckerInterface: '@App\Security\OwnershipChecker'
    App\Interface\Auth\AuthenticationResolverInterface: '@App\Security\AuthenticationResolver'
    App\Interface\UploadBatchRepositoryInterface: '@App\Repository\UploadBatchRepository'
    App\Interface\Notification\BatchCompletionNotifierInterface: '@App\Service\Notification\BatchCompletionNotifier'
    App\Interface\Share\ShareNotificationMailerInterface: '@App\Service\Share\ShareNotificationMailer'
    App\Interface\Folder\FolderZipArchiverInterface: '@App\Service\Folder\FolderZipArchiver'
    App\Interface\Broadcast\BroadcastTargetProviderInterface: '@App\Service\Broadcast\BroadcastTargetProvider'
    App\Interface\Broadcast\BroadcastMailerInterface: '@App\Service\Broadcast\BroadcastMailer'
    App\Interface\Broadcast\BroadcastOrchestratorInterface: '@App\Service\Broadcast\BroadcastOrchestrator'
    App\Interface\ActivityTrackerInterface:       '@App\Service\ActivityTracker'
    App\Interface\Monitoring\DeployNotificationMailerInterface: '@App\Service\Monitoring\DeployNotificationMailer'
    App\Interface\Monitoring\InstanceMonitoringReporterInterface: '@App\Service\Monitoring\InstanceMonitoringReporter'

    App\State\AlbumProcessor:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $albumRepository: '@App\Interface\Album\AlbumRepositoryInterface'
            $userRepository: '@App\Interface\UserRepositoryInterface'
            $provider: '@App\State\AlbumProvider'
            $filenameValidator: '@App\Service\File\FilenameValidator'
            $ownershipChecker: '@App\Security\OwnershipChecker'

    App\State\FileProcessor:
        arguments:
            $em: '@doctrine.orm.entity_manager'
            $fileRepository: '@App\Repository\FileRepository'
            $mediaRepository: '@App\Repository\MediaRepository'
            $storageService: '@App\Service\File\StorageService'
            $authResolver: '@App\Security\AuthenticationResolver'
            $defaultFolderService: '@App\Service\Folder\DefaultFolderService'
            $fileActionService: '@App\Service\File\FileActionService'
            $requestStack: '@request_stack'
            $iriExtractor: '@App\Service\IriExtractor'
    
    App\Security\AuthenticationResolver:
        arguments:
            $tokenStorage: '@security.token_storage'
            $userRepository: '@App\Repository\UserRepository'
            $logger: '@logger'

    App\Security\AuthorizationChecker: ~

    App\Service\File\FileActionService:
        arguments:
            $fileRepository: '@App\Repository\FileRepository'
            $storageService: '@App\Service\File\StorageService'
            $authChecker: '@App\Security\AuthorizationChecker'
            $em: '@doctrine.orm.entity_manager'

    App\Service\File\CreateFileService:
        arguments:
            $storageService: '@App\Service\File\StorageService'
            $defaultFolderService: '@App\Service\Folder\DefaultFolderService'
            $em: '@doctrine.orm.entity_manager'
            $userRepository: '@App\Repository\UserRepository'

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $sharedToken: '%env(BROADCAST_SHARED_TOKEN)%'
            string $adminEmail: '%env(BROADCAST_ADMIN_EMAIL)%'
            string $currentInstance: '%env(BROADCAST_INSTANCE_NAME)%'
            string $configPath: '%kernel.project_dir%/config/broadcast_targets.php'
            string $githubToken: '%env(GITHUB_PAT)%'
            string $mailerDsn: '%env(MAILER_DSN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'

    App\Factory\FolderTreeFactory:
        arguments:
            $folderRepository: '@App\Repository\FolderRepository'
            $userRepository: '@App\Repository\UserRepository'
            $em: '@doctrine.orm.entity_manager'

    App\Service\File\UploadRoutingDecider:
        arguments:
            $deferredThresholdBytes: '%hc.upload.deferred_threshold_bytes%'

    App\Service\Notification\NotificationFeedProvider:
        arguments:
            $normalizers: !tagged_iterator App\Interface\Notification\NotificationNormalizerInterface

    # Déclaration explicite du FolderProcessor pour garantir l'injection
    App\State\FolderProcessor:
        arguments:
            $folderService:    '@App\Service\Folder\FolderService'
            $folderRepository: '@App\Interface\Folder\FolderRepositoryInterface'
            $userRepository:   '@App\Interface\UserRepositoryInterface'
            $provider:         '@App\State\FolderProvider'
            $requestStack:     '@request_stack'
            $iriExtractor:     '@App\Service\IriExtractor'

    App\Service\Folder\FolderService:
        arguments:
            $folderRepository:     '@App\Interface\Folder\FolderRepositoryInterface'
            $filenameValidator:    '@App\Interface\File\FilenameValidatorInterface'
            $ownershipChecker:     '@App\Interface\Auth\OwnershipCheckerInterface'
            $authResolver:         '@App\Interface\Auth\AuthenticationResolverInterface'
            $defaultFolderService: '@App\Service\Folder\DefaultFolderService'
            $em:                   '@doctrine.orm.entity_manager'
            $logger:               '@logger'
            $stopwatch:            '@debug.stopwatch'

    App\Service\File\StorageService:
        arguments:
            $storageDir: '%app.storage_dir%'

    App\Service\ActivityTracker:
        arguments:
            $filePath: '%app.activity_tracker.file_path%'

    App\Service\Monitoring\DeployNotificationMailer:
        arguments:
            $reportEmail: '%env(DEPLOY_REPORT_EMAIL)%'

    App\Service\Media\RawPreviewCache:
        arguments:
            $storageDir: '%app.storage_dir%'

    App\Interface\Media\RawPreviewCacheInterface: '@App\Service\Media\RawPreviewCache'

    App\Interface\Media\ExifThumbnailExtractorInterface: '@App\Service\Media\ExifThumbnailExtractor'

    App\Service\Video\VideoDurationProbe:
        arguments:
            $ffprobeBin: '%app.ffprobe_bin%'

    App\Service\Video\VideoFrameGrabber:
        arguments:
            $ffmpegBin: '%app.ffmpeg_bin%'

    App\Interface\VideoDurationProbeInterface: '@App\Service\Video\VideoDurationProbe'
    App\Interface\VideoFrameGrabberInterface: '@App\Service\Video\VideoFrameGrabber'
    App\Interface\VideoThumbnailExtractorInterface: '@App\Service\Video\FfmpegVideoThumbnailExtractor'

    App\Service\Media\ThumbnailService:
        arguments:
            $storageDir: '%app.storage_dir%'
            $rawPreviewExtractor: '@RonanLenouvel\RawPreviewExtractor\RawPreviewExtractorInterface'
            $exifThumbnailExtractor: '@App\Interface\Media\ExifThumbnailExtractorInterface'
            $videoThumbnailExtractor: '@App\Interface\VideoThumbnailExtractorInterface'

    App\EventListener\SecurityHeadersListener:
        arguments:
            $env: '%kernel.environment%'

    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }

    App\State\ShareProcessor:
        arguments:
            $shareCreationLimiter: '@limiter.share_creation'

    App\Controller\Api\ResetPasswordController:
        arguments:
            $resetPasswordRequestLimiter: '@limiter.reset_password_request'
            $resetPasswordSubmitLimiter: '@limiter.reset_password_submit'

when@dev:
    services:
        App\DataFixtures\AppFixtures:
            arguments:
                $storageDir: '%app.storage_dir%'
                $projectDir: '%kernel.project_dir%'

when@test:
    services:
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            alias: security.password_hasher
            public: true
        # Rendre le TokenStorage public en test
        Symfony\Component\Security\Core\Authentication\Token\Storage\TokenStorageInterface:
            alias: security.token_storage
            public: true
        # Rendre MessengerMessageRepository public en test (repository DBAL pur, pas ServiceEntityRepository)
        App\Repository\MessengerMessageRepository:
            autowire: true
            public: true
        # Rendre le prober SMTP substituable en test (éviter toute vraie I/O réseau)
        App\Interface\Notification\SmtpConnectivityProberInterface:
            alias: App\Service\Notification\SmtpConnectivityProber
            public: true
        # Rendre MailerConnectivityChecker substituable en test (classe finale, non mockable directement)
        App\Service\Notification\MailerConnectivityChecker:
            autowire: true
            public: true
            bind:
                string $mailerDsn: '%env(MAILER_DSN)%'
        # Rendre ActivityTrackerInterface public en test (lecture directe du fichier d'activité, #422)
        App\Interface\ActivityTrackerInterface:
            alias: App\Service\ActivityTracker
            public: true
        # Rendre CronHealthReporter public en test (accès direct au transport failed)
        App\Service\Monitoring\CronHealthReporter:
            autowire: true
            public: true
        # Rendre InstanceMonitoringReporter public en test
        App\Service\Monitoring\InstanceMonitoringReporter:
            autowire: true
            public: true
        # Rendre FolderMoverInterface public en test (accès direct dans
        # FolderMoverIntegrationTest depuis #439 — plus aucun autowiring
        # implicite depuis que FolderWebController délègue à FolderService)
        App\Interface\Folder\FolderMoverInterface:
            alias: App\Service\Folder\FolderMover
            public: true
        # Substituer le HttpClient global en test : évite de vrais appels
        # réseau sortants (timeout) dans les tests web qui passent par
        # InstanceMonitoringOrchestrator (#376) sans mocker explicitement.
        Symfony\Contracts\HttpClient\HttpClientInterface:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments:
                $responseFactory: null
