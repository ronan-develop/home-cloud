name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Vérifier qu'au moins un label est présent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json labels -q '.labels | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Aucun label sur cette PR — le changelog (/changelog) filtre par label (feature/bug/securité/performance), une PR sans label reste invisible pour l'utilisateur final."
            exit 1
          fi
          echo "✅ $COUNT label(s) présent(s)."

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # requis pour committer le CSS rebuildé sur la branche de la PR

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homecloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          # Sur une PR, GitHub checkout par défaut un merge commit éphémère
          # (fusion PR+base) — le rebuild Tailwind doit committer sur le
          # vrai dernier commit de la branche source, jamais sur cette
          # fusion synthétique.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: 🎬 Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_mysql, sodium
          ini-values: post_max_size=512M, upload_max_filesize=512M

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🔍 Audit des dépendances
        run: composer audit

      - name: ⏳ Wait for MariaDB
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 2
          done
          echo '✅ MariaDB ready'

      - name: 🔧 Create CI test env
        run: |
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/homecloud?serverVersion=mariadb-10.11.0&charset=utf8mb4" > .env.test.local
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env.test.local
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env.test.local
          echo "JWT_PASSPHRASE=" >> .env.test.local

      - name: 🔑 Generate JWT keypair
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

      - name: 🗄️ Run Doctrine migrations
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: 🎨 Build Tailwind CSS
        run: php bin/console tailwind:build

      - name: 🧪 Run PHPUnit
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: ./vendor/bin/phpunit --configuration phpunit.dist.xml --colors=always

      # Le serveur o2switch ne build jamais Tailwind lui-même (mutualisé,
      # résultat peu fiable) — le CSS minifié est buildé ici, récupéré
      # ensuite par un simple `git checkout` côté serveur au déploiement.
      #
      # Committé directement sur la branche SOURCE de la PR (jamais sur
      # main, qui refuse tout push direct y compris depuis GITHUB_TOKEN,
      # cf. CLAUDE.md « jamais de commit direct sur main ») : le CSS est
      # donc déjà à jour au moment du merge, sans PR de rebuild séparée
      # à traiter après coup (ancienne approche : ouvrait puis auto-mergeait
      # une PR chore/tailwind-rebuild-* sur main, bruit + branches mortes).
      # Ignoré sur push direct à main (rebuild déjà fait via la PR qui l'a
      # mergé) et sur une PR dont la branche vient d'un fork (GITHUB_TOKEN
      # n'a pas les droits d'écriture dessus).
      - name: 🎨 Rebuild le CSS Tailwind sur la branche de la PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php bin/console tailwind:build --minify
          if git diff --quiet -- var/tailwind/app.built.css; then
            echo "CSS inchangé, rien à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add var/tailwind/app.built.css
          git commit -m "🎨 chore(assets): rebuild Tailwind"
          git push origin "HEAD:${{ github.head_ref }}"

  js:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 📦 Install JS dependencies
        run: npm ci

      - name: 🧪 Run JS tests
        run: npm test --silent
