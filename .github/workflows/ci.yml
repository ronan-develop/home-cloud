name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Vérifier qu'au moins un label est présent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json labels -q '.labels | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Aucun label sur cette PR — le changelog (/changelog) filtre par label (feature/bug/securité/performance), une PR sans label reste invisible pour l'utilisateur final."
            exit 1
          fi
          echo "✅ $COUNT label(s) présent(s)."

      # Sans ticket lié, une PR peut être mergée sans jamais fermer d'issue
      # ("Development: None yet" côté GitHub) — repéré manuellement après
      # coup à plusieurs reprises (PR #495, 2026-09-27). Un mot-clé de
      # fermeture (Closes/Fixes/Resolves #N, insensible à la casse, n'importe
      # où dans le corps) rend ce lien obligatoire dès l'ouverture de la PR.
      - name: 🔗 Vérifier qu'un ticket est référencé (Closes/Fixes/Resolves #N)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json body -q '.body')
          if ! echo "$BODY" | grep -qiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+'; then
            echo "::error::Aucun ticket référencé dans cette PR — ajoutez 'Closes #<numéro>' (ou Fixes/Resolves) dans le corps, y compris pour un fix mineur (créez le ticket si aucun n'existe déjà)."
            exit 1
          fi
          echo "✅ Ticket référencé."

      # Plusieurs PR/tickets sont restés sans assignee jusqu'à correction
      # manuelle après coup (session du 2026-09-27) — rend le suivi de qui
      # travaille sur quoi obligatoire dès l'ouverture de la PR.
      - name: 👤 Vérifier qu'un assignee est présent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json assignees -q '.assignees | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Aucun assignee sur cette PR — assignez-vous cette PR avant de la soumettre."
            exit 1
          fi
          echo "✅ $COUNT assignee(s) présent(s)."

  php:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homecloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          # Sur une PR, GitHub checkout par défaut un merge commit éphémère
          # (fusion PR+base) — on teste le vrai dernier commit de la branche
          # source, jamais cette fusion synthétique.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

      - name: 🎬 Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_mysql, sodium
          ini-values: post_max_size=512M, upload_max_filesize=512M

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🔍 Audit des dépendances
        run: composer audit

      - name: ⏳ Wait for MariaDB
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 2
          done
          echo '✅ MariaDB ready'

      - name: 🔧 Create CI test env
        run: |
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/homecloud?serverVersion=mariadb-10.11.0&charset=utf8mb4" > .env.test.local
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env.test.local
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env.test.local
          echo "JWT_PASSPHRASE=" >> .env.test.local

      - name: 🔑 Generate JWT keypair
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

      - name: 🗄️ Run Doctrine migrations
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      # --minify dès ce build unique : composer build-assets (local) et la CI
      # produisent désormais le même CSS minifié (#486) — un deuxième build
      # non-minifié juste pour PHPUnit serait un doublon jeté immédiatement
      # après (constaté le 2026-09-27 : deux tailwind:build successifs sur
      # le même code dans le même job).
      - name: 🎨 Build Tailwind CSS
        run: php bin/console tailwind:build --minify

      # Le serveur o2switch ne build jamais Tailwind lui-même (mutualisé,
      # /tmp monté noexec bloque Bun/Tailwind même via var/tmp, testé et
      # abandonné en mars 2026) — le CSS minifié doit donc être committé
      # à jour AVANT le push, récupéré ensuite par un simple `git checkout`
      # côté serveur au déploiement.
      #
      # Filet de sécurité : le hook pre-commit local (bin/git-hooks/pre-commit)
      # rebuild ET stage désormais automatiquement ce fichier dès qu'un
      # .twig/CSS est modifié — ce check ne devrait donc plus jamais se
      # déclencher en usage normal. Il couvre uniquement les cas hors hook
      # (commit --no-verify, machine sans hook installé). Pas de commit
      # correctif ici : un commit poussé par la CI elle-même déclenchait un
      # second run CI classé "Action required", bloqué sans approbation
      # manuelle (vécu PR #489, 2026-09-27).
      - name: 🎨 Vérifie que le CSS Tailwind committé est à jour
        run: |
          if ! git diff --quiet -- var/tailwind/app.built.css; then
            echo "::error::var/tailwind/app.built.css n'est pas à jour avec les templates/styles de cette branche. Lancez 'composer build-assets', committez le résultat, puis repoussez. (Si vous utilisez le hook pre-commit du projet, ceci ne devrait normalement jamais arriver.)"
            exit 1
          fi

      - name: 🧪 Run PHPUnit
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: ./vendor/bin/phpunit --configuration phpunit.dist.xml --colors=always

  js:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 📦 Install JS dependencies
        run: npm ci

      - name: 🧪 Run JS tests
        run: npm test --silent
