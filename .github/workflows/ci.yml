name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  labels:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Vérifier qu'au moins un label est présent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json labels -q '.labels | length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Aucun label sur cette PR — le changelog (/changelog) filtre par label (feature/bug/securité/performance), une PR sans label reste invisible pour l'utilisateur final."
            exit 1
          fi
          echo "✅ $COUNT label(s) présent(s)."

  php:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # requis pour pousser la branche de rebuild Tailwind (#421)
      pull-requests: write  # requis pour ouvrir la PR de rebuild Tailwind (#421)

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homecloud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🎬 Ensure ffmpeg
        run: ffmpeg -version >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, pdo_mysql, sodium
          ini-values: post_max_size=512M, upload_max_filesize=512M

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 🔍 Audit des dépendances
        run: composer audit

      - name: ⏳ Wait for MariaDB
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; do
            echo 'Waiting for MariaDB...'
            sleep 2
          done
          echo '✅ MariaDB ready'

      - name: 🔧 Create CI test env
        run: |
          echo "DATABASE_URL=mysql://root:root@127.0.0.1:3306/homecloud?serverVersion=mariadb-10.11.0&charset=utf8mb4" > .env.test.local
          echo "JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem" >> .env.test.local
          echo "JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem" >> .env.test.local
          echo "JWT_PASSPHRASE=" >> .env.test.local

      - name: 🔑 Generate JWT keypair
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists --env=test

      - name: 🗄️ Run Doctrine migrations
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: 🎨 Build Tailwind CSS
        run: php bin/console tailwind:build

      - name: 🧪 Run PHPUnit
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: ./vendor/bin/phpunit --configuration phpunit.dist.xml --colors=always

      # Déploiement nocturne autonome (#421) : le serveur ne build jamais
      # Tailwind lui-même (mutualisé, résultat peu fiable) — le CSS minifié
      # est buildé ici, récupéré ensuite par un simple `git checkout` côté
      # serveur. La règle de protection de main interdit tout push direct
      # (y compris depuis GITHUB_TOKEN, aucun bypass configuré ni souhaité,
      # cf. CLAUDE.md « jamais de commit direct sur main ») : on ouvre donc
      # une PR au lieu de push, à merger manuellement.
      - name: 🎨 Proposer le rebuild du CSS Tailwind
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php bin/console tailwind:build --minify
          if git diff --quiet -- var/tailwind/app.built.css; then
            echo "CSS inchangé, rien à proposer."
            exit 0
          fi
          BRANCH="chore/tailwind-rebuild-${GITHUB_SHA::7}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add var/tailwind/app.built.css
          git commit -m "🎨 chore(assets): rebuild Tailwind"
          git push origin "$BRANCH"
          gh pr create \
            --title "🎨 chore(assets): rebuild Tailwind" \
            --body "CSS Tailwind rebuildé automatiquement après le merge de ${GITHUB_SHA::7} sur main." \
            --label ci \
            --base main \
            --head "$BRANCH"

  js:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 📦 Install JS dependencies
        run: npm ci

      - name: 🧪 Run JS tests
        run: npm test --silent
